<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate beautiful GitHub profile cards using live GitHub API data. Built with Vanilla JavaScript.">
    <title>GitHub Profile Card Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.ico">
</head>
<body>
    <!-- HEADER SECTION -->
    <header class="header">
        <div class="container">
            <h1>GitHub Profile Card Generator</h1>
            <p>Create beautiful profile cards for any GitHub user</p>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="container">
            
            <!-- SEARCH SECTION -->
            <section class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="username-input" 
            
                        placeholder="Enter GitHub username (e.g., torvalds)"
                        
                    >
                    <button id="generate-btn" class="btn-primary">
                        Generate Card
                    </button>
                </div>
                <p class="error-message" id="error-message"></p>
            </section>
            <!-- RECENT SEARCHES -->
<div class="recent-searches" id="recent-searches">
    <h3>Recent Searches</h3>
    <ul id="recent-list"></ul>
</div>

            <!-- LOADING SPINNER -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching profile data...</p>
            </div>

            <!-- PROFILE CARD (Will be filled by JavaScript) -->
            <section class="profile-card" id="profile-card">
                <!-- JavaScript will put content here -->
            </section>
    
            <!-- THEME TOGGLE -->
            <div class="theme-toggle">
                <button id="theme-btn">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-text">Dark Mode</span>
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Built with ❤️ by [ M.V.K ] | 
           <a href="https://github.com/yourusername/github-profile-card-generator" target="_blank">
               View Source
           </a>
           <a href="..." target="_blank" rel="noopener noreferrer">

        </p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
