<!DOCTYPE html>
<html lang="en">

<head>
    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Generate beautiful GitHub profile cards using live GitHub API data. Built with Vanilla JavaScript.">

    <title>GitHub Profile Card Generator</title>

    <!-- STYLES -->
    <link rel="stylesheet" href="css/style.css">

    <!-- FAVICON -->
    <link rel="icon" href="assets/favicon.ico">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="container header-flex">

            <div class="logo-title">
                <img id="github-logo" src="assets/GitHub_Invertocat_Black.png" alt="GitHub Logo" class="logo">

                <h1>GitHub Profile Card Generator</h1>
            </div>

            <p class="subtitle">
                Create beautiful profile cards for any GitHub user
            </p>

        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="main">
        <div class="container">

            <!-- ========= SEARCH ========= -->
            <section class="search-section">
                <div class="search-box">
                    <input type="text" id="username-input" placeholder="Enter GitHub username (e.g., torvalds)"
                        autocomplete="off">
                    <button id="generate-btn" class="btn-primary">
                        Generate Card
                    </button>
                </div>
                <p class="error-message" id="error-message"></p>
            </section>

            <!-- ========= RECENT SEARCHES ========= -->
            <section class="recent-searches">
                <h3>Recent Searches</h3>
                <ul id="recent-list"></ul>
            </section>

            <!-- ========= COMPARE USERS ========= -->
            <section class="compare-section">
                <h3>Compare Two Users</h3>

                <div class="compare-inputs">
                    <input type="text" id="user1" placeholder="First username">
                    <input type="text" id="user2" placeholder="Second username">
                    <button id="compare-btn" class="btn-primary">Compare</button>
                </div>

                <div id="compare-result" class="compare-result"></div>
            </section>

            <!-- ========= LOADING ========= -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching profile data...</p>
            </div>

            <!-- ========= PROFILE CARD ========= -->
            <section class="profile-card" id="profile-card"></section>

            <!-- ========= THEME TOGGLE ========= -->
            <div class="theme-toggle">
                <button id="theme-btn">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-text">Dark Mode</span>
                </button>
            </div>

        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <p>
            Built with ❤️ by <strong>M.V.K</strong> |
            <a href="https://github.com/mvkrishna24/github-profile-card-generator" target="_blank">
                View Source
            </a>
        </p>
    </footer>

    <!-- ================= SCRIPT ================= -->
    <script type="module" src="js/app.js"></script>

</body>

</html>
